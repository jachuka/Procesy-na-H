name: Aplikacja Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Test calculations
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Procesy-na-sztuke --add-data "static:static" desktop.py
      - name: Test executable startup and bundled files
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\Procesy-na-sztuke.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Executable startup timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Executable failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Procesy-na-sztuke-Windows
          path: dist/Procesy-na-sztuke.exe
      - name: Publish Windows executable
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'v' + (Get-Content VERSION -Raw).Trim() }
          gh release create $tag dist/Procesy-na-sztuke.exe --target $env:RELEASE_TARGET --title "Procesy na sztukę $tag" --notes "Aplikacja Windows: pobierz Procesy-na-sztuke.exe i uruchom dwuklikiem. Dodano osobną grupę RBH SUMMA: sumowanie czasów, godziny na sztukę i kopiowanie. Dotychczasowe obliczenia RBH, dodatków, tworzyw, TORRO i GUTENBERG pozostają bez zmian. Nie wymaga instalacji Pythona."
