name: Aplikacja Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Test calculations
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Procesy-na-sztuke --add-data "static:static" desktop.py
      - name: Test executable startup and bundled files
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\Procesy-na-sztuke.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Executable startup timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Executable failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Procesy-na-sztuke-Windows
          path: dist/Procesy-na-sztuke.exe
      - name: Publish Windows executable
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/Procesy-na-sztuke.exe --title "Procesy na sztukę $env:GITHUB_REF_NAME" --notes "Aplikacja Windows: pobierz Procesy-na-sztuke.exe i uruchom dwuklikiem. Nie wymaga instalacji Pythona."
